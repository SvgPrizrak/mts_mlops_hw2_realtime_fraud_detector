apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres-ds
    type: postgres
    access: proxy
    url: postgres:5432
    database: fraud_db
    user: fraud_user
    secureJsonData:
      password: fraud_pass
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: false
    editable: true