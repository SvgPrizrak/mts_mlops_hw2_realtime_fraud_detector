global:
  scrape_interval: 1s      # Как часто Prometheus собирает метрики
  evaluation_interval: 1s  # Как часто Prometheus пересчитывает правила

scrape_configs:
  # Метрики самого Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Системные метрики через node-exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Метрики ML-сервиса fraud_detector
  - job_name: "fraud_detector"
    static_configs:
      - targets: ["fraud_detector:8000"]

  # Метрики сервиса записи результатов в PostgreSQL
  - job_name: "scoring_writer"
    static_configs:
      - targets: ["scoring_writer:8001"]